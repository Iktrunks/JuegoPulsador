<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>El Pulsador Rojo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: white;
            overflow: hidden;
            touch-action: manipulation;
        }

        .push-button {
            position: relative;
            width: 220px;
            height: 220px;
            background: #dc2626;
            border-radius: 50%;
            border: 8px solid #991b1b;
            box-shadow: 0 15px 0 #7f1d1d, 0 20px 30px rgba(0, 0, 0, 0.5);
            transition: all 0.1s ease;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .push-button:active {
            transform: translateY(10px);
            box-shadow: 0 5px 0 #7f1d1d, 0 10px 20px rgba(0, 0, 0, 0.5);
        }

        .button-text {
            font-weight: 900;
            font-size: 1.5rem;
            text-transform: uppercase;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.3);
        }

        .particle {
            position: absolute;
            pointer-events: none;
            border-radius: 50%;
            animation: explode 0.6s ease-out forwards;
        }

        @keyframes explode {
            0% {
                transform: scale(1);
                opacity: 1;
            }

            100% {
                transform: translate(var(--tx), var(--ty)) scale(0);
                opacity: 0;
            }
        }

        .counter-animate {
            animation: pop 0.2s ease-out;
        }

        @keyframes pop {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
                color: #ef4444;
            }

            100% {
                transform: scale(1);
            }
        }

        .achievement-toast {
            animation: slideIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes slideIn {
            from {
                transform: translateY(100px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
    </style>
</head>

<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <!-- Encabezado y Contador -->
    <div class="text-center mb-12">
        <h1 class="text-gray-400 text-sm uppercase tracking-widest font-bold mb-2">Total de pulsaciones</h1>
        <div id="counter" class="text-7xl md:text-9xl font-black text-white">0</div>
    </div>

    <!-- El Botón -->
    <div class="relative">
        <button id="mainButton" class="push-button">
            <span class="button-text">PÚLSAME</span>
        </button>
    </div>

    <!-- Mensaje de Logro -->
    <div id="achievementContainer" class="fixed bottom-10 flex flex-col items-center gap-2">
        <!-- Los logros aparecerán aquí -->
    </div>

    <!-- Estadísticas simples -->
    <div class="mt-16 text-gray-500 text-sm italic">
        <p id="rank">Rango: Novato</p>
    </div>

    <script>
        let count = 0;
        const counterEl = document.getElementById('counter');
        const button = document.getElementById('mainButton');
        const rankEl = document.getElementById('rank');
        const achievementContainer = document.getElementById('achievementContainer');

        const achievements = {
            10: "¡Nada mal! Empezamos bien.",
            50: "¡Vas en serio! 50 toques.",
            100: "¡CENTENARIO! Eres imparable.",
            250: "¡Dedo de acero!",
            500: "¡LEYENDA DEL CLIC!",
            1000: "¿No te cansas?"
        };

        function createParticles(x, y) {
            for (let i = 0; i < 8; i++) {
                const p = document.createElement('div');
                p.classList.add('particle');
                const size = Math.random() * 10 + 5;
                p.style.width = `${size}px`;
                p.style.height = `${size}px`;
                p.style.backgroundColor = '#ef4444';

                // Dirección aleatoria
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * 100 + 50;
                p.style.setProperty('--tx', `${Math.cos(angle) * dist}px`);
                p.style.setProperty('--ty', `${Math.sin(angle) * dist}px`);

                p.style.left = `${x}px`;
                p.style.top = `${y}px`;

                document.body.appendChild(p);
                setTimeout(() => p.remove(), 600);
            }
        }

        function showAchievement(text) {
            const toast = document.createElement('div');
            toast.className = 'achievement-toast bg-white text-black px-6 py-3 rounded-full font-bold shadow-2xl flex items-center gap-2';
            toast.innerHTML = `<span>🏆</span> ${text}`;

            achievementContainer.appendChild(toast);

            setTimeout(() => {
                toast.style.opacity = '0';
                toast.style.transition = 'opacity 0.5s ease';
                setTimeout(() => toast.remove(), 500);
            }, 3000);
        }

        function updateRank() {
            if (count >= 1000) rankEl.innerText = "Rango: Dios del Pulsador";
            else if (count >= 500) rankEl.innerText = "Rango: Maestro";
            else if (count >= 100) rankEl.innerText = "Rango: Experto";
            else if (count >= 50) rankEl.innerText = "Rango: Entusiasta";
            else rankEl.innerText = "Rango: Novato";
        }

        function handlePress(e) {
            count++;

            // Actualizar contador con animación
            counterEl.innerText = count;
            counterEl.classList.remove('counter-animate');
            void counterEl.offsetWidth; // Trigger reflow
            counterEl.classList.add('counter-animate');

            // Partículas
            const rect = button.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            createParticles(centerX, centerY);

            // Verificar logros
            if (achievements[count]) {
                showAchievement(achievements[count]);
            }

            updateRank();

            // Pequeña vibración en móviles si está disponible
            if (navigator.vibrate) {
                navigator.vibrate(10);
            }
        }

        // Soportar tanto clic como toque
        button.addEventListener('click', handlePress);

        // Evitar zoom al tocar rápido en móviles
        document.addEventListener('touchstart', (e) => {
            if (e.touches.length > 1) e.preventDefault();
        }, { passive: false });
    </script>
</body>

</html>
